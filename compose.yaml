services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: postgres
      LAUNCHFLOW_DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/01-create-app.sh:/docker-entrypoint-initdb.d/01-create-app.sh:ro
    healthcheck:
      test: [CMD-SHELL, "PGPASSWORD=$$LAUNCHFLOW_DB_PASSWORD psql -h 127.0.0.1 -U launchflow -d launchflow -Atqc 'select 1'"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./api
    environment:
      DB_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      LLM_URL: ${LLM_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --no-access-log"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: ./web
      args:
        API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  db-data:
